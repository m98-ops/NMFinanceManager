<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NM Finance</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN (Siste stabile versjon) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>NM Finance</h1>
      <div id="user-info" class="hidden">
        <span id="user-name"></span>
        <button id="logout-btn" class="btn-secondary">Logg ut</button>
      </div>
    </header>

    <!-- AUTENTISERINGSKORT -->
    <main id="auth-section">
      <div class="card">
        <div class="tabs">
          <button id="tab-login" type="button" class="tab-btn active">Logg inn</button>
          <button id="tab-signup" type="button" class="tab-btn">Registrer deg</button>
        </div>

        <!-- Boks for feilmeldinger -->
        <div id="auth-error" class="error-box hidden"></div>

        <!-- Innloggingsskjema -->
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">E-post</label>
            <input type="email" id="login-email" required placeholder="din@epost.no">
          </div>
          <div class="form-group">
            <label for="login-password">Passord</label>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>
          <button type="submit" id="login-submit-btn" class="btn-primary">Logg inn</button>
        </form>

        <!-- Registreringsskjema -->
        <form id="signup-form" class="hidden">
          <div class="form-group">
            <label for="signup-email">E-post</label>
            <input type="email" id="signup-email" required placeholder="din@epost.no">
          </div>
          <div class="form-group">
            <label for="signup-password">Passord</label>
            <input type="password" id="signup-password" required placeholder="••••••••">
          </div>
          <div class="form-group">
            <label for="signup-firstname">Fornavn</label>
            <input type="text" id="signup-firstname" required placeholder="Ola">
          </div>
          <div class="form-group">
            <label for="signup-lastname">Etternavn</label>
            <input type="text" id="signup-lastname" required placeholder="Nordmann">
          </div>
          <div class="form-group">
            <label for="signup-username">Brukernavn</label>
            <input type="text" id="signup-username" required placeholder="olanordmann">
          </div>
          <button type="submit" id="signup-submit-btn" class="btn-primary">Opprett konto</button>
        </form>
      </div>
    </main>

    <!-- HOVEDSIDE (Vises etter innlogging) -->
    <main id="app-section" class="hidden">
      <section class="card">
        <h2>Registrer kjøp</h2>
        <form id="transaction-form">
          <div class="form-group">
            <label for="trans-store">Butikk</label>
            <input type="text" id="trans-store" required placeholder="f.eks. Rema 1000">
          </div>
          <div class="form-group">
            <label for="trans-amount">Beløp (kr)</label>
            <input type="number" step="0.01" id="trans-amount" required placeholder="0.00">
          </div>
          <div class="form-group">
            <label for="trans-desc">Beskrivelse / Produkter</label>
            <input type="text" id="trans-desc" placeholder="f.eks. Melk, brød og middag">
          </div>
          <div class="form-group">
            <label for="trans-date">Dato</label>
            <input type="date" id="trans-date" required>
          </div>
          <button type="submit" class="btn-primary">Legg til kjøp</button>
        </form>
      </section>

      <section class="card">
        <h2>Månedens forbruk</h2>
        <div id="total-spent" class="total-display">Totalt: <span>0</span> kr</div>
        <ul id="transactions-list" class="transaction-list"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
